services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-teamflow}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-teamflow_local_only}
      POSTGRES_DB: postgres
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
      - ./infra/postgres/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-teamflow} -d postgres"]
      interval: 5s
      timeout: 5s
      retries: 10

  identity-service:
    build:
      context: ./backend/identity-service
    environment:
      SERVER_PORT: 8081
      DB_HOST: postgres
      DB_PORT: 5432
      DB_NAME: identity_db
      DB_USER: ${POSTGRES_USER:-teamflow}
      DB_PASSWORD: ${POSTGRES_PASSWORD:-teamflow_local_only}
    ports:
      - "${IDENTITY_SERVICE_PORT:-8081}:8081"
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:8081/health | grep -q 'UP'"]
      interval: 10s
      timeout: 5s
      retries: 10

  team-service:
    build:
      context: ./backend/team-service
    environment:
      SERVER_PORT: 8082
      DB_HOST: postgres
      DB_PORT: 5432
      DB_NAME: team_db
      DB_USER: ${POSTGRES_USER:-teamflow}
      DB_PASSWORD: ${POSTGRES_PASSWORD:-teamflow_local_only}
    ports:
      - "${TEAM_SERVICE_PORT:-8082}:8082"
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:8082/health | grep -q 'UP'"]
      interval: 10s
      timeout: 5s
      retries: 10

  project-service:
    build:
      context: ./backend/project-service
    environment:
      SERVER_PORT: 8083
      DB_HOST: postgres
      DB_PORT: 5432
      DB_NAME: project_db
      DB_USER: ${POSTGRES_USER:-teamflow}
      DB_PASSWORD: ${POSTGRES_PASSWORD:-teamflow_local_only}
    ports:
      - "${PROJECT_SERVICE_PORT:-8083}:8083"
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:8083/health | grep -q 'UP'"]
      interval: 10s
      timeout: 5s
      retries: 10

  planning-service:
    build:
      context: ./backend/planning-service
    environment:
      SERVER_PORT: 8084
      DB_HOST: postgres
      DB_PORT: 5432
      DB_NAME: planning_db
      DB_USER: ${POSTGRES_USER:-teamflow}
      DB_PASSWORD: ${POSTGRES_PASSWORD:-teamflow_local_only}
      TEAM_SERVICE_URL: http://team-service:8082
      PROJECT_SERVICE_URL: http://project-service:8083
    ports:
      - "${PLANNING_SERVICE_PORT:-8084}:8084"
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:8084/health | grep -q 'UP'"]
      interval: 10s
      timeout: 5s
      retries: 10

  frontend:
    build:
      context: ./frontend
    environment:
      VITE_IDENTITY_SERVICE_URL: http://localhost:${IDENTITY_SERVICE_PORT:-8081}
      VITE_TEAM_SERVICE_URL: http://localhost:${TEAM_SERVICE_PORT:-8082}
      VITE_PROJECT_SERVICE_URL: http://localhost:${PROJECT_SERVICE_PORT:-8083}
      VITE_PLANNING_SERVICE_URL: http://localhost:${PLANNING_SERVICE_PORT:-8084}
    ports:
      - "${FRONTEND_PORT:-5173}:5173"
    depends_on:
      identity-service:
        condition: service_healthy
      team-service:
        condition: service_healthy
      project-service:
        condition: service_healthy
      planning-service:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:5173/ | grep -q 'TeamFlow'"]
      interval: 10s
      timeout: 5s
      retries: 10

volumes:
  postgres-data:
